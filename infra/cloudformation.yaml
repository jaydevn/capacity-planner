AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  asg-insights — Flask + SQLite dashboard on a single EC2 behind an
  internet-facing Application Load Balancer. A systemd timer polls Auto
  Scaling groups (by tag) across all enabled account regions for predictive
  scaling forecasts and target-tracking data.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the dashboard EC2 instance runs.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >-
      Subnet in the VPC where the dashboard EC2 instance runs. With a public
      load balancer in front, this can be a private subnet; the instance takes
      traffic only from the ALB security group.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      Two or more PUBLIC subnets in different AZs for the internet-facing
      Application Load Balancer. Must include the AZ of SubnetId so the ALB can
      reach the instance target.
  SourceBucketName:
    Type: String
    Description: >-
      Existing S3 bucket that holds the app source (deploy.sh creates it with
      encryption + public-access-block controls before running this stack).
    AllowedPattern: ^[a-z0-9][a-z0-9.\-]{1,61}[a-z0-9]$
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: >-
      CIDR allowed to reach the public load balancer on port 80. Defaults to
      the whole internet; restrict to an office/VPN range for a tighter posture.
    AllowedPattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large, m5.large]
    Description: EC2 instance type for the collector and dashboard.
  UbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id
    Description: SSM parameter path resolved to a current Ubuntu 22.04 AMI.
  DiscoveryTagKey:
    Type: String
    Default: Environment
    Description: Tag key used to discover ASGs to track.
  DiscoveryTagVal:
    Type: String
    Default: prod
    Description: Tag value used to discover ASGs to track.
  ScanRegions:
    Type: String
    Default: all
    AllowedPattern: ^(all|[a-z0-9-]+(,[a-z0-9-]+)*)$
    ConstraintDescription: Use 'all' or comma-separated AWS region names without spaces.
    Description: >-
      'all' (default) scans every region enabled in the account; or a
      comma-separated allowlist to restrict scanning to specific regions.
  DnsHostedZoneId:
    Type: String
    Default: ""
    Description: Optional — Route53 hosted zone ID to create a record in. Leave blank to skip.
  DnsRecordName:
    Type: String
    Default: ""
    Description: Optional — FQDN for the dashboard (e.g. scaling-insights.internal.example.com).

Conditions:
  CreateDnsRecord: !And
    - !Not [!Equals [!Ref DnsHostedZoneId, ""]]
    - !Not [!Equals [!Ref DnsRecordName, ""]]

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: read-source-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub "arn:aws:s3:::${SourceBucketName}"
                  - !Sub "arn:aws:s3:::${SourceBucketName}/*"
        - PolicyName: read-asg-metrics
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:DescribePolicies
                  - autoscaling:DescribeScalingActivities
                  - autoscaling:DescribeTags
                  - autoscaling:GetPredictiveScalingForecast
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetGroupAttributes
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - ec2:DescribeInstances
                  - ec2:DescribeLaunchTemplateVersions
                  - ec2:DescribeRegions
                  - pricing:GetProducts
                Resource: "*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VpcId
      GroupDescription: !Sub "asg-insights public ALB (${AWS::StackName})"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedCidr
          Description: Public HTTP to the load balancer
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: All egress (forward to instance targets)

  DashboardSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VpcId
      GroupDescription: !Sub "asg-insights dashboard (${AWS::StackName})"
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: All egress (AWS APIs + apt)

  # Separate ingress rule so the instance SG accepts :80 only from the ALB SG.
  DashboardSgFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DashboardSg
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref AlbSg
      Description: Dashboard HTTP from the public ALB only

  Dashboard:
    Type: AWS::EC2::Instance
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [E1029]
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref DashboardSg]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 20
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-dashboard"
        - Key: App
          Value: asg-insights
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          export SRC_S3="s3://${SourceBucketName}/"
          export AWS_REGION="${AWS::Region}"
          apt-get update -y && apt-get install -y awscli
          aws s3 cp "s3://${SourceBucketName}/scripts/user_data.sh" /tmp/bootstrap.sh
          chmod +x /tmp/bootstrap.sh
          SRC_S3="$SRC_S3" AWS_REGION="$AWS_REGION" \
            ASG_SCAN_REGIONS="${ScanRegions}" \
            ASG_DISCOVERY_TAG_KEY="${DiscoveryTagKey}" \
            ASG_DISCOVERY_TAG_VAL="${DiscoveryTagVal}" \
            /tmp/bootstrap.sh 2>&1 | tee /var/log/asg-insights-bootstrap.log

  PublicAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${AWS::StackName}-alb"
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Ref PublicSubnetIds
      SecurityGroups: [!Ref AlbSg]
      Tags:
        - Key: App
          Value: asg-insights

  DashboardTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${AWS::StackName}-tg"
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      Targets:
        - Id: !Ref Dashboard
          Port: 80

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref PublicAlb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref DashboardTargetGroup

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecord
    Properties:
      HostedZoneId: !Ref DnsHostedZoneId
      Name: !Ref DnsRecordName
      Type: A
      AliasTarget:
        DNSName: !GetAtt PublicAlb.DNSName
        HostedZoneId: !GetAtt PublicAlb.CanonicalHostedZoneID

Outputs:
  SourceBucketOut:
    Description: Bucket the instance reads app source from (created by deploy.sh).
    Value: !Ref SourceBucketName
  ScanRegionsOut:
    Description: Regions configured for ASG collection.
    Value: !Ref ScanRegions
  SyncCommand:
    Description: Copy-paste to push updated source to the instance.
    Value: !Sub "aws s3 sync . s3://${SourceBucketName}/ --exclude '.venv/*' --exclude '*.db' --exclude '.git/*'"
  DashboardPrivateIp:
    Description: Private IP of the dashboard instance.
    Value: !GetAtt Dashboard.PrivateIp
  LoadBalancerDns:
    Description: Public DNS name of the internet-facing load balancer.
    Value: !GetAtt PublicAlb.DNSName
  DashboardUrl:
    Description: Public dashboard URL (custom DNS if configured, else ALB DNS).
    Value: !If
      - CreateDnsRecord
      - !Sub "http://${DnsRecordName}/"
      - !Sub "http://${PublicAlb.DNSName}/"
